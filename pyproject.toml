[project]
name = "barterbench"
version = "2.0.0"
description = "Competitive barter-market benchmark for locally served LLM agents, rated with Bradley-Terry"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The inference server runs on the GPU box; install separately:  pip install vllm
serve = ["vllm>=0.8.0"]

[project.scripts]
barterbench = "barterbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["barterbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
